target-version = "py312"
line-length = 120

[lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "E501",    # line too long — handled by formatter
    "RUF012",  # mutable class default — false positives with SQLAlchemy
    "RUF001",  # ambiguous Unicode — false positives for Hebrew strings
    "RUF003",  # ambiguous Unicode in comments — Hebrew and en-dashes OK
    "RUF006",  # store create_task reference — fire-and-forget is intentional
    "SIM105",  # contextlib.suppress — try/except/pass is clearer in async code
    "B008",    # Depends() in arg defaults — FastAPI standard pattern
]

[lint.isort]
known-first-party = ["app"]

[format]
quote-style = "double"
indent-style = "space"
