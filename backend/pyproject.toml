[tool.poetry]
package-mode = false

[project]
name = "orellius-backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Orellius",email = "noreply@orellius.ai"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi (>=0.135.1,<0.136.0)",
    "uvicorn[standard] (>=0.41.0,<0.42.0)",
    "websockets (>=16.0,<17.0)",
    "telethon (>=1.42.0,<2.0.0)",
    "langchain (>=1.2.10,<2.0.0)",
    "langgraph (>=1.0.10,<2.0.0)",
    "langchain-anthropic (>=1.3.4,<2.0.0)",
    "sqlalchemy[asyncio] (>=2.0.48,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "redis[hiredis] (>=7.2.1,<8.0.0)",
    "qdrant-client (>=1.17.0,<2.0.0)",
    "pillow (>=12.1.1,<13.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "pydantic-settings (>=2.13.1,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "aiofiles (>=25.1.0,<26.0.0)",
    "opencv-python-headless (>=4.10.0,<5.0.0)",
    "greenlet (>=3.3.2,<4.0.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "sentry-sdk[fastapi] (>=2.21.0,<3.0.0)",
    "python-jose[cryptography] (>=3.3.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "stripe (>=12.0.0,<13.0.0)",
    "staticmap (>=0.5.7,<1.0.0)",
    "shapely (>=2.0.0,<3.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=6.2.0,<7.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "ruff (>=0.15.4,<0.16.0)",
    "mypy (>=1.19.1,<2.0.0)"
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
